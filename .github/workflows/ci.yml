name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint (flake8)
        run: flake8 models/ services/ tests/ --select=E9,F63,F7,F82 --count

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=models --cov=services --cov-report=term-missing --cov-fail-under=15

      - name: Check deployment target
        run: echo "✅ Lint + tests passed — Streamlit Cloud will auto-deploy from master"
